<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tests — Bracket Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #111;
        color: #f7f2f1;
        padding: 24px;
        max-width: 940px;
      }
      h1 { margin: 0 0 12px; font-size: 22px; }
      .subtitle { margin: 0 0 24px; color: #b8aea8; }
      .summary {
        padding: 14px 16px; border-radius: 8px; margin: 0 0 18px;
        font-weight: bold;
      }
      .summary.pass { background: #1e3a1e; color: #b8e8b8; }
      .summary.fail { background: #4a1414; color: #f4b9b9; }
      ul.cases { list-style: none; padding: 0; margin: 0; }
      ul.cases li {
        padding: 8px 12px; border-bottom: 1px solid #2a2a2a;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px; line-height: 1.5;
        display: flex; gap: 10px; align-items: flex-start;
      }
      ul.cases li.pass::before { content: "✓"; color: #6ad06a; font-weight: bold; }
      ul.cases li.fail::before { content: "✗"; color: #ff7777; font-weight: bold; }
      .case-name { color: #f7f2f1; flex: 1; }
      .case-detail {
        color: #b8aea8; font-size: 12px; margin-left: 24px;
        white-space: pre-wrap;
      }
      footer {
        margin-top: 32px; color: #8a807a; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Tests — Bracket Builder</h1>
    <p class="subtitle">
      Suite de asserts para <code>admin/js/bracket-builder.js</code>. Pura JS,
      sin red.
    </p>

    <div id="summary" class="summary">Corriendo…</div>
    <ul id="results" class="cases"></ul>

    <footer>
      Referencia: <code>PRD-brackets-mma.md</code> §8.5, <code>TASKS.md</code> T13.
    </footer>

    <script src="./bracket-builder.js"></script>
    <script>
      (function () {
        "use strict";

        var results = [];

        function assert(name, actual, expected) {
          var pass = deepEqual(actual, expected);
          results.push({ name: name, pass: pass, actual: actual, expected: expected });
        }
        function assertTrue(name, actual) {
          results.push({ name: name, pass: actual === true, actual: actual, expected: true });
        }

        function deepEqual(a, b) {
          if (a === b) return true;
          if (typeof a !== typeof b) return false;
          if (a && b && typeof a === "object") {
            var ak = Object.keys(a);
            var bk = Object.keys(b);
            if (ak.length !== bk.length) return false;
            for (var i = 0; i < ak.length; i += 1) {
              if (!deepEqual(a[ak[i]], b[ak[i]])) return false;
            }
            return true;
          }
          return false;
        }

        function mkAtleta(id, nombre) {
          return { id: id, nombre_completo: nombre || id };
        }

        function mkInscripcion(insId, atletaId, categoria, nombre) {
          return {
            id: insId,
            atleta_id: atletaId,
            atleta: mkAtleta(atletaId, nombre),
            categoria_calculada: categoria,
          };
        }

        var BB = window.BracketBuilder;

        // ---------------------------------------------------------
        // 1. agruparAtletas
        // ---------------------------------------------------------

        // Array vacío
        assert("agruparAtletas([]) → []", BB.agruparAtletas([]), []);

        // Input no-array
        assert("agruparAtletas(null) → []", BB.agruparAtletas(null), []);

        // 3 atletas misma categoría → 1 grupo viable single_elimination
        var insMisma = [
          mkInscripcion("ins_1", "atl_1", "Adultos / M / Avanzado / Peso Ligero"),
          mkInscripcion("ins_2", "atl_2", "Adultos / M / Avanzado / Peso Ligero"),
          mkInscripcion("ins_3", "atl_3", "Adultos / M / Avanzado / Peso Ligero"),
        ];
        var grp1 = BB.agruparAtletas(insMisma);
        assertTrue("agruparAtletas(3 misma cat).length === 1", grp1.length === 1);
        assertTrue("grupo viable === true", grp1[0].viable === true);
        assertTrue("grupo num_atletas === 3", grp1[0].num_atletas === 3);
        assertTrue("grupo tipo_sugerido === 'single_elimination'", grp1[0].tipo_sugerido === "single_elimination");

        // 1 atleta solo → grupo no viable
        var insUno = [mkInscripcion("ins_1", "atl_1", "Adultos / M / Avanzado / Peso Ligero")];
        var grp2 = BB.agruparAtletas(insUno);
        assertTrue("agruparAtletas(1 atleta) length === 1", grp2.length === 1);
        assertTrue("grupo 1 atleta viable === false", grp2[0].viable === false);
        assertTrue("grupo 1 atleta tipo_sugerido === null", grp2[0].tipo_sugerido === null);

        // 2 atletas misma categoría → tipo dos_atletas
        var insDos = [
          mkInscripcion("ins_1", "atl_1", "Junior / F / Novato / Átomo"),
          mkInscripcion("ins_2", "atl_2", "Junior / F / Novato / Átomo"),
        ];
        var grp3 = BB.agruparAtletas(insDos);
        assertTrue("2 atletas → viable", grp3[0].viable === true);
        assertTrue("2 atletas → tipo 'dos_atletas'", grp3[0].tipo_sugerido === "dos_atletas");

        // Múltiples categorías mezcladas
        var insMixto = [
          mkInscripcion("ins_1", "atl_1", "Adultos / M / Avanzado / Peso Ligero"),
          mkInscripcion("ins_2", "atl_2", "Adultos / M / Avanzado / Peso Ligero"),
          mkInscripcion("ins_3", "atl_3", "Adultos / M / Avanzado / Peso Ligero"),
          mkInscripcion("ins_4", "atl_4", "Adultos / F / Intermedio / Mosca"),
          mkInscripcion("ins_5", "atl_5", "Adultos / F / Intermedio / Mosca"),
          mkInscripcion("ins_6", "atl_6", "Juvenil A / M / Novato / Pluma"),
        ];
        var grpMixto = BB.agruparAtletas(insMixto);
        assertTrue("3 categorías distintas → 3 grupos", grpMixto.length === 3);
        var ligero = grpMixto.find(function (g) { return g.categoria.indexOf("Peso Ligero") >= 0; });
        assertTrue("Peso Ligero tiene 3 atletas", ligero && ligero.num_atletas === 3);
        var mosca = grpMixto.find(function (g) { return g.categoria.indexOf("Mosca") >= 0; });
        assertTrue("Mosca tiene 2 atletas viables", mosca && mosca.viable && mosca.num_atletas === 2);
        var pluma = grpMixto.find(function (g) { return g.categoria.indexOf("Pluma") >= 0; });
        assertTrue("Pluma tiene 1 atleta no viable", pluma && !pluma.viable);

        // ---------------------------------------------------------
        // 2. generarSingleElimination — casos N pequeños
        // ---------------------------------------------------------

        // 0 atletas
        assert("generarSingleElimination([]) → []", BB.generarSingleElimination([]), []);

        // 1 atleta
        assert(
          "generarSingleElimination([1 atleta]) → []",
          BB.generarSingleElimination([mkAtleta("a")]),
          [],
        );

        // 2 atletas → 1 pelea final
        var p2 = BB.generarSingleElimination([mkAtleta("a"), mkAtleta("b")]);
        assertTrue("N=2 → 1 pelea total", p2.length === 1);
        assertTrue("N=2 → ronda 'final'", p2[0].ronda === "final");
        assertTrue("N=2 → numero=1", p2[0].numero === 1);
        assertTrue("N=2 → atleta1.id === 'a'", p2[0].atleta1.id === "a");
        assertTrue("N=2 → atleta2.id === 'b'", p2[0].atleta2.id === "b");
        assertTrue("N=2 → no es bye", p2[0].bye === false);

        // ---------------------------------------------------------
        // 3. Conteos para N = 3..16
        // ---------------------------------------------------------

        function mkAtletas(n) {
          var out = [];
          for (var i = 0; i < n; i += 1) out.push(mkAtleta("a" + (i + 1)));
          return out;
        }

        // N=3: slots=4, byes=1, total=3, reales=2, byes=1
        var p3 = BB.generarSingleElimination(mkAtletas(3));
        var r3 = BB.resumenPeleas(p3);
        assertTrue("N=3 → 3 peleas totales", r3.total === 3);
        assertTrue("N=3 → 1 bye en bracket", r3.byes === 1);
        assertTrue("N=3 → 2 peleas reales", r3.reales === 2);
        // R1 son semis
        var p3R1 = p3.filter(function (p) { return p.ronda_idx === 0; });
        assertTrue("N=3 → R1 tiene 2 peleas", p3R1.length === 2);
        assertTrue("N=3 → R1 ronda='semifinal'", p3R1[0].ronda === "semifinal");
        assertTrue("N=3 → R1 tiene 1 bye", p3R1.filter(function (p) { return p.bye; }).length === 1);
        // Final
        var p3F = p3.filter(function (p) { return p.ronda === "final"; });
        assertTrue("N=3 → 1 final", p3F.length === 1);

        // N=4: slots=4, byes=0, total=3, reales=3
        var p4 = BB.generarSingleElimination(mkAtletas(4));
        var r4 = BB.resumenPeleas(p4);
        assertTrue("N=4 → 3 peleas totales", r4.total === 3);
        assertTrue("N=4 → 0 byes", r4.byes === 0);
        assertTrue("N=4 → R1 semifinales", p4.filter(function (p) { return p.ronda_idx === 0; }).every(function (p) { return p.ronda === "semifinal"; }));

        // N=5: slots=8, byes=3, total=7, reales=4
        var p5 = BB.generarSingleElimination(mkAtletas(5));
        var r5 = BB.resumenPeleas(p5);
        assertTrue("N=5 → 7 peleas totales", r5.total === 7);
        assertTrue("N=5 → 3 byes en R1", p5.filter(function (p) { return p.ronda_idx === 0 && p.bye; }).length === 3);
        assertTrue("N=5 → 4 peleas reales", r5.reales === 4);
        assertTrue("N=5 → R1 ronda='cuartos'", p5.filter(function (p) { return p.ronda_idx === 0; })[0].ronda === "cuartos");

        // N=6: slots=8, byes=2, total=7
        var p6 = BB.generarSingleElimination(mkAtletas(6));
        var r6 = BB.resumenPeleas(p6);
        assertTrue("N=6 → 7 peleas totales", r6.total === 7);
        assertTrue("N=6 → 2 byes en R1", p6.filter(function (p) { return p.ronda_idx === 0 && p.bye; }).length === 2);
        assertTrue("N=6 → 5 peleas reales", r6.reales === 5);

        // N=7: slots=8, byes=1, total=7
        var p7 = BB.generarSingleElimination(mkAtletas(7));
        var r7 = BB.resumenPeleas(p7);
        assertTrue("N=7 → 7 peleas totales", r7.total === 7);
        assertTrue("N=7 → 1 bye en R1", p7.filter(function (p) { return p.ronda_idx === 0 && p.bye; }).length === 1);
        assertTrue("N=7 → 6 peleas reales", r7.reales === 6);

        // N=8: slots=8, byes=0, total=7
        var p8 = BB.generarSingleElimination(mkAtletas(8));
        var r8 = BB.resumenPeleas(p8);
        assertTrue("N=8 → 7 peleas totales", r8.total === 7);
        assertTrue("N=8 → 0 byes", r8.byes === 0);
        assertTrue("N=8 → 7 reales (todas)", r8.reales === 7);

        // N=16: slots=16, byes=0, total=15
        var p16 = BB.generarSingleElimination(mkAtletas(16));
        var r16 = BB.resumenPeleas(p16);
        assertTrue("N=16 → 15 peleas totales", r16.total === 15);
        assertTrue("N=16 → 0 byes", r16.byes === 0);
        assertTrue("N=16 → R1 ronda='octavos'", p16.filter(function (p) { return p.ronda_idx === 0; })[0].ronda === "octavos");

        // N=9: slots=16, byes=7, total=15
        var p9 = BB.generarSingleElimination(mkAtletas(9));
        var r9 = BB.resumenPeleas(p9);
        assertTrue("N=9 → 15 peleas totales", r9.total === 15);
        assertTrue("N=9 → 7 byes en R1", p9.filter(function (p) { return p.ronda_idx === 0 && p.bye; }).length === 7);
        assertTrue("N=9 → 8 peleas reales (15-7)", r9.reales === 8);

        // ---------------------------------------------------------
        // 4. Estructura del bracket — números secuenciales, referencias
        // ---------------------------------------------------------

        // Para N=4: peleas numeradas 1,2,3 secuencial
        var nums4 = p4.map(function (p) { return p.numero; });
        assert("N=4 → números secuenciales 1,2,3", nums4, [1, 2, 3]);

        // Final referencia las 2 peleas anteriores
        var final4 = p4.find(function (p) { return p.ronda === "final"; });
        assertTrue("N=4 final pelea_anterior_1 !== null", final4.pelea_anterior_1 !== null);
        assertTrue("N=4 final pelea_anterior_2 !== null", final4.pelea_anterior_2 !== null);
        assertTrue("N=4 final referencias distintas", final4.pelea_anterior_1 !== final4.pelea_anterior_2);

        // Para N=5: el atleta con bye debe estar pre-poblado en R2
        var p5Bye = p5.filter(function (p) { return p.ronda_idx === 0 && p.bye; });
        var autoIds = p5Bye.map(function (p) { return p.auto_ganador_id; });
        // En R2 debe haber 3 atletas pre-poblados (los 3 que tuvieron bye)
        var p5R2 = p5.filter(function (p) { return p.ronda_idx === 1; });
        var preFilledIds = [];
        p5R2.forEach(function (p) {
          if (p.atleta1) preFilledIds.push(p.atleta1.id);
          if (p.atleta2) preFilledIds.push(p.atleta2.id);
        });
        assertTrue(
          "N=5 → 3 atletas pre-poblados en R2 (los del bye)",
          preFilledIds.length === 3 && autoIds.every(function (id) { return preFilledIds.indexOf(id) >= 0; }),
        );

        // ---------------------------------------------------------
        // 5. No double-byes (ningún match tiene atleta1=null Y atleta2=null)
        // ---------------------------------------------------------

        [p3, p5, p6, p7, p9, p16].forEach(function (peleas, idx) {
          var Ns = [3, 5, 6, 7, 9, 16][idx];
          var doubleByes = peleas.filter(function (p) {
            return p.ronda_idx === 0 && p.atleta1 === null && p.atleta2 === null;
          }).length;
          assertTrue("N=" + Ns + " → 0 double-byes en R1", doubleByes === 0);
        });

        // ---------------------------------------------------------
        // 6. nombreRonda
        // ---------------------------------------------------------

        assert("nombreRonda(2) === 'final'", BB.nombreRonda(2), "final");
        assert("nombreRonda(4) === 'semifinal'", BB.nombreRonda(4), "semifinal");
        assert("nombreRonda(8) === 'cuartos'", BB.nombreRonda(8), "cuartos");
        assert("nombreRonda(16) === 'octavos'", BB.nombreRonda(16), "octavos");
        assert("nombreRonda(32) === 'dieciseisavos'", BB.nombreRonda(32), "dieciseisavos");
        assert("nombreRonda(64) === 'treintaidosavos'", BB.nombreRonda(64), "treintaidosavos");
        assert("nombreRonda(128) === 'ronda_128' (fallback)", BB.nombreRonda(128), "ronda_128");

        // ---------------------------------------------------------
        // 7. generarBracketsParaGrupos
        // ---------------------------------------------------------

        var grupos = BB.agruparAtletas(insMixto);
        var brackets = BB.generarBracketsParaGrupos(grupos);
        assertTrue("brackets.length === 2 (solo viables)", brackets.length === 2);
        var bLigero = brackets.find(function (b) { return b.categoria.indexOf("Peso Ligero") >= 0; });
        assertTrue("bracket Peso Ligero tipo 'single_elimination'", bLigero && bLigero.tipo === "single_elimination");
        assertTrue("bracket Peso Ligero tiene 3 peleas", bLigero && bLigero.peleas.length === 3);
        var bMosca = brackets.find(function (b) { return b.categoria.indexOf("Mosca") >= 0; });
        assertTrue("bracket Mosca tipo 'dos_atletas'", bMosca && bMosca.tipo === "dos_atletas");
        assertTrue("bracket Mosca tiene 1 pelea", bMosca && bMosca.peleas.length === 1);

        // ---------------------------------------------------------
        // Render
        // ---------------------------------------------------------

        var ul = document.getElementById("results");
        var pass = 0, fail = 0;
        results.forEach(function (r) {
          var li = document.createElement("li");
          li.className = r.pass ? "pass" : "fail";
          var name = document.createElement("span");
          name.className = "case-name";
          name.textContent = r.name;
          li.appendChild(name);
          if (!r.pass) {
            var detail = document.createElement("div");
            detail.className = "case-detail";
            detail.textContent =
              "esperado: " + JSON.stringify(r.expected, null, 2) +
              "\nactual:   " + JSON.stringify(r.actual, null, 2);
            li.appendChild(detail);
          }
          ul.appendChild(li);
          if (r.pass) pass += 1; else fail += 1;
          console[r.pass ? "log" : "error"](
            (r.pass ? "✓ " : "✗ ") + r.name,
            r.pass ? "" : { esperado: r.expected, actual: r.actual },
          );
        });

        var summary = document.getElementById("summary");
        summary.textContent =
          (fail === 0 ? "✅ " : "❌ ") + pass + " pasaron, " + fail +
          " fallaron (total " + (pass + fail) + ").";
        summary.className = "summary " + (fail === 0 ? "pass" : "fail");
        console.log(summary.textContent);
      })();
    </script>
  </body>
</html>
