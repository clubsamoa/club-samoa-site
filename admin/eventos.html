<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Eventos · Admin · Club Samoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/logo-black.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles-admin.css" />
  </head>
  <body data-section="eventos" data-title="Eventos" data-subtitle="Brackets MMA — gestión de eventos del club">
    <main class="admin-main">
      <div data-slot="main-actions">
        <button class="btn btn-primary" type="button" id="btn-nuevo-evento">
          + Nuevo evento
        </button>
      </div>

      <div class="toolbar">
        <div class="toolbar-filters">
          <div class="btn-group" role="group" aria-label="Filtro de estatus">
            <button class="btn btn-sm is-active" data-filter="estatus" data-value="" type="button">Todos</button>
            <button class="btn btn-sm" data-filter="estatus" data-value="borrador" type="button">Borrador</button>
            <button class="btn btn-sm" data-filter="estatus" data-value="activo" type="button">Activo</button>
            <button class="btn btn-sm" data-filter="estatus" data-value="finalizado" type="button">Finalizado</button>
          </div>
        </div>
        <div class="toolbar-count" id="eventos-count" aria-live="polite"></div>
      </div>

      <div id="eventos-list" class="eventos-list">
        <div class="loading-message">Cargando eventos...</div>
      </div>
    </main>

    <script src="../registration-config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/eventos-form.js"></script>
    <script src="./js/eventos-listado.js"></script>
    <script src="./js/shell.js"></script>
  </body>
</html>
