<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Evento · Admin · Club Samoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/logo-black.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles-admin.css" />
  </head>
  <body data-section="eventos" data-title="Evento" data-subtitle="Cargando…">
    <main class="admin-main">
      <div data-slot="main-actions">
        <a class="btn btn-ghost" href="./eventos.html">← Todos los eventos</a>
      </div>

      <div class="evento-tabs" role="tablist">
        <button class="evento-tab is-active" data-tab="detalle" type="button" role="tab">Detalle</button>
        <button class="evento-tab" data-tab="inscripciones" type="button" role="tab">Inscripciones</button>
        <button class="evento-tab" data-tab="pesaje" type="button" role="tab">Pesaje</button>
        <button class="evento-tab" data-tab="brackets" type="button" role="tab">Brackets</button>
        <button class="evento-tab" data-tab="resumen" type="button" role="tab">Resumen</button>
      </div>

      <div class="evento-tab-panels">
        <section class="evento-tab-panel is-active" data-panel="detalle" role="tabpanel">
          <div class="loading-message">Cargando evento...</div>
        </section>
        <section class="evento-tab-panel" data-panel="inscripciones" role="tabpanel" hidden>
          <!-- Renderizado por evento-inscripciones.js al activarse -->
        </section>
        <section class="evento-tab-panel" data-panel="pesaje" role="tabpanel" hidden>
          <!-- Renderizado por evento-pesaje.js al activarse -->
        </section>
        <section class="evento-tab-panel" data-panel="brackets" role="tabpanel" hidden>
          <!-- Renderizado por evento-brackets.js al activarse -->
        </section>
        <section class="evento-tab-panel" data-panel="resumen" role="tabpanel" hidden>
          <!-- Renderizado por evento-resumen.js al activarse -->
        </section>
      </div>
    </main>

    <script src="../registration-config.js"></script>
    <script src="./js/reglamento.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/eventos-form.js"></script>
    <script src="./js/inscripciones-form.js"></script>
    <script src="./js/evento-inscripciones.js"></script>
    <script src="./js/evento-pesaje.js"></script>
    <script src="./js/bracket-builder.js"></script>
    <script src="./js/bracket-svg.js"></script>
    <script src="./js/evento-brackets.js"></script>
    <script src="./js/evento-resumen.js"></script>
    <script src="./js/evento.js"></script>
    <script src="./js/shell.js"></script>
  </body>
</html>
