<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Scoreboard · Club Samoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/logo-black.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles-admin.css" />
  </head>
  <body class="scoreboard-page">
    <header class="scoreboard-header">
      <div class="scoreboard-brand">
        <img src="../images/logo-white.png" alt="Club Samoa" />
        <div class="scoreboard-brand-text">
          <strong id="scoreboard-title">Scoreboard</strong>
          <span id="scoreboard-meta">Cargando…</span>
        </div>
      </div>
      <div class="scoreboard-header-actions">
        <a class="btn btn-ghost btn-sm" href="javascript:history.back()" id="btn-back">← Volver</a>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" title="Refrescar datos">⟳</button>
        <button class="btn btn-primary btn-sm" id="btn-fullscreen" title="Pantalla completa (Esc para salir)">⛶ Pantalla completa</button>
      </div>
    </header>

    <main class="scoreboard-main" id="scoreboard-main">
      <div class="loading-message" style="text-align:center; padding:80px 20px;">
        Cargando pelea…
      </div>
    </main>

    <script src="../registration-config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/reglamento.js"></script>
    <script src="./js/scoreboard.js"></script>
  </body>
</html>
