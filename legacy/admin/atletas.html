<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Atletas · Admin · Club Samoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../images/logo-black.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles-admin.css" />
  </head>
  <body data-section="atletas" data-title="Atletas" data-subtitle="Catálogo de competidores del club">
    <main class="admin-main">
      <div data-slot="main-actions">
        <button class="btn btn-primary" type="button" id="btn-nuevo-atleta">
          + Nuevo atleta
        </button>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <input
            type="search"
            id="filter-search"
            placeholder="Buscar por nombre o academia..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="toolbar-filters">
          <div class="btn-group" role="group" aria-label="Filtro de género">
            <button class="btn btn-sm is-active" data-filter="genero" data-value="" type="button">Todos</button>
            <button class="btn btn-sm" data-filter="genero" data-value="Masculino" type="button">Masculino</button>
            <button class="btn btn-sm" data-filter="genero" data-value="Femenino" type="button">Femenino</button>
          </div>

          <label class="select-wrap">
            <span class="select-label">Nivel</span>
            <select id="filter-nivel">
              <option value="">Todos</option>
              <option value="Novato">Novato</option>
              <option value="Principiante">Principiante</option>
              <option value="Intermedio">Intermedio</option>
              <option value="Avanzado">Avanzado</option>
            </select>
          </label>
        </div>

        <div class="toolbar-count" id="atletas-count" aria-live="polite"></div>
      </div>

      <div id="atletas-list" class="atletas-list">
        <div class="loading-message">Cargando atletas...</div>
      </div>
    </main>

    <script src="../registration-config.js"></script>
    <script src="./js/reglamento.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/atletas-form.js"></script>
    <script src="./js/atletas-listado.js"></script>
    <script src="./js/shell.js"></script>
  </body>
</html>
